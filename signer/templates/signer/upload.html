{% extends 'signer/base.html' %}

{% block content %}
<div class="upload-container">
    <div class="upload-card glassmorphic">
        <h1>Sign PDF Documents</h1>
        <p>Upload your PDF letter to securely add a digital signature.</p>
        
        <form method="post" enctype="multipart/form-data" class="upload-form">
            {% csrf_token %}
            <div class="file-drop-area" id="drop-zone">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <span class="file-msg">Drag & drop your PDF here or click to browse</span>
                {{ form.original_pdf }}
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="upload-btn" disabled>Continue to Sign</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const fileInput = document.getElementById('pdf-upload');
        const dropZone = document.getElementById('drop-zone');
        const fileMsg = document.querySelector('.file-msg');
        const uploadBtn = document.getElementById('upload-btn');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileMsg.textContent = e.target.files[0].name;
                dropZone.classList.add('has-file');
                uploadBtn.disabled = false;
            }
        });

        // Drag and drop styles
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('highlight'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('highlight'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            let dt = e.dataTransfer;
            let files = dt.files;
            if(files.length > 0 && files[0].type === 'application/pdf') {
                fileInput.files = files;
                fileMsg.textContent = files[0].name;
                dropZone.classList.add('has-file');
                uploadBtn.disabled = false;
            } else {
                alert('Please upload a PDF file.');
            }
        }, false);
    });
</script>
{% endblock %}
